{% set name = "river-rna" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/xxTAT/river-rna/archive/1.1.0/v{{ version }}.tar.gz
  sha256: #sha256sum v1.1.0.tar.gz

build:
  number: 0
  skip: true  # [win]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - river = river.cli:main
#  run_exports:
#    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - llvm-openmp  # [osx]
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - wheel
    - cython >=3.0
    - numpy
  run:
    - python >=3.9
    - {{ pin_compatible('numpy') }}
    - scipy >=1.8
    - pyyaml
    - rnastructure
    - viennarna
    - bedtools
    - openjdk >=8
    - juicertools >=2.20.00
    - llvm-openmp  # [osx]

test:
  imports:
    - river
    - river._expand
  commands:
    - river --help
    - river presets short
    - juicer_tools --version

about:
  home: https://github.com/xxTAT/river-rna
  license: MIT
  summary: RIVER - an integrated framework for inferring RNA secondary structures and their alternatives from RNA–RNA interaction maps
